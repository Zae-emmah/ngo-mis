server.port=${PORT:8080}

# Database (PostgreSQL). Defaults suit a local Postgres; set SPRING_DATASOURCE_* on Render.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ngomis}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

# Emails are sent through Brevo's HTTP API (env: BREVO_API_KEY, MAIL_FROM), not SMTP.
management.health.mail.enabled=false
